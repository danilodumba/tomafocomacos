# Convenções de Clean Code do projeto (arquitetura §8, T-03).
included:
  - App
  - Packages
excluded:
  - Packages/*/.build
  - "**/*.generated.swift"

opt_in_rules:
  - empty_count
  - force_unwrapping
  - explicit_init
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - closure_spacing

# Funções curtas, um nível de abstração; sem force-unwrap em produção.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error

function_body_length:
  warning: 40
  error: 80
type_body_length:
  warning: 250
  error: 400
line_length:
  warning: 120
  error: 160
  ignores_comments: true
identifier_name:
  min_length: 2
  excluded: [id, i, x, s, a, b, d]
